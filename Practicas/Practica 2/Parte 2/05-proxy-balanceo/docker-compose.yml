services:
  api:
    build: ./api
    environment:
      PORT: ${API_INTERNAL_PORT:-3000}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:${MONGO_INTERNAL_PORT:-27017}/${MONGO_DB}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - red_frontal
      - red_datos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/salud').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - datos_mongo:/data/db
    networks:
      - red_datos
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - red_frontal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/salud >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  datos_mongo:

networks:
  red_frontal:
    driver: bridge
  red_datos:
    driver: bridge
    internal: true
