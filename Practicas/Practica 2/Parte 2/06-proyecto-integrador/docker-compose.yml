services:
  api:
    build: ./api
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/${MONGO_DB:-bibliotecadb}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - red_frontal
      - red_datos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/salud').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-bibliotecadb}
    volumes:
      - datos_biblioteca:/data/db
      - ./mongo-init/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    networks:
      - red_datos
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8086}:80"
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - red_frontal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  datos_biblioteca:
    name: ${MONGO_VOLUME:-parte2_biblioteca_datos}

networks:
  red_frontal:
    driver: bridge
  red_datos:
    driver: bridge
    internal: true
